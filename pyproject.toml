[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "bypasskit"
version = "0.1.0"
description = "HTTP and browser transport library with policy-driven escalation and challenge handling"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]
dependencies = [
    "curl_cffi>=0.7.0",
    "playwright>=1.40.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bypasskit = ["py.typed"]
