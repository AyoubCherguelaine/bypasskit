[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "bypasskit"
version = "0.1.0"
description = "HTTP and browser transport library with policy-driven escalation and challenge handling"
requires-python = ">=3.10"
dependencies = [
    "curl_cffi",
    "playwright",
]

[tool.setuptools]
packages = [
    "bypasskit",
    "bypasskit.challenge",
    "bypasskit.fingerprint",
    "bypasskit.proxy",
    "bypasskit.transport",
]

[tool.setuptools.package-dir]
bypasskit = "."
